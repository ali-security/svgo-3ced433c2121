name: CI
env:
  FORCE_COLOR: 2
  NODE: 20
  # The sealed version bump touches package.json, so don't let yarn berry's CI
  # default (immutable installs) turn lockfile bookkeeping into a red leg.
  YARN_ENABLE_IMMUTABLE_INSTALLS: false
on:
  # Only workflow_dispatch on the seal fork: `push`/`pull_request` would fire
  # every sync push and run CI nobody asked for.
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional jest test name/path pattern'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  lint:
    # disabled on the seal fork: eslint + prettier + tsc are style/type gates,
    # not tests — nothing we ship depends on them.
    if: false
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: yarn
      - run: yarn install
      - run: yarn lint
      - run: yarn typecheck
  regression:
    # disabled on the seal fork: downloads a large external SVG corpus
    if: false
    name: Test regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: yarn
      - run: yarn install
      - run: yarn playwright install --with-deps chromium
      - run: yarn test-regression
  pack:
    # Added on the seal fork: upstream has no workflow that builds the release
    # tarball (publish.yml needs npm publish credentials we don't have), so the
    # pack steps live here, in the workflow that already runs the test suite.
    name: Pack tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
      - run: yarn install
      # `files` includes `dist`, and the published tarball's
      # dist/svgo.browser.js is produced only by the `prepublishOnly` script
      # (`rm -rf dist && rollup -c`), which `yarn pack` (berry) does not run.
      - name: Build dist bundle (prepublishOnly)
        run: rm -rf dist && yarn rollup -c
      - name: Pack
        run: yarn pack --out '%s-%v.tgz'
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: svgo-*.tgz
          if-no-files-found: error
  test:
    name: ${{ matrix.os }} Node.js ${{ matrix.node-version }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 23
          - 20
          - 18
          - 16
          - 14
        os:
          - ubuntu-latest
          - windows-latest
      # Node 14 is EOL, and its jest `--experimental-vm-modules` worker dies
      # with SIGSEGV in lib/svgo-node.test.js on the ubuntu-24.04 image that
      # `ubuntu-latest` now resolves to. Pin that single leg to ubuntu-22.04 —
      # the image `ubuntu-latest` meant when 3.3.3 was released — so it still
      # runs the whole suite. The leg is kept, not dropped.
        exclude:
          - node-version: 14
            os: ubuntu-latest
        include:
          - node-version: 14
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn install
      - run: yarn test ${{ inputs.test-filter }}
        shell: bash
